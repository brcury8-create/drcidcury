<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="logo-titulo">
  <title id="logo-titulo">Clínica Médica Dr. Cid Cury</title>

  <!-- Redesenho vetorial da marca fotografada em style_references/cidcury_04.png.
       Proporções medidas sobre a placa: cruz ocupa ~38% da largura do coração e
       fica deslocada ~8% à esquerda do centro; a faixa azul corre por fora da
       borda inferior esquerda, do meio do coração até a ponta. -->

  <!-- Coração -->
  <path d="M50 89
           C 45.5 84.5, 9 57.5, 9 33.5
           C 9 18.5, 20.5 8.5, 32.5 8.5
           C 41 8.5, 47 13.5, 50 19.5
           C 53 13.5, 59 8.5, 67.5 8.5
           C 79.5 8.5, 91 18.5, 91 33.5
           C 91 57.5, 54.5 84.5, 50 89 Z"
        fill="#CE2E28"/>

  <!-- Cruz médica -->
  <g fill="#FFFFFF">
    <rect x="38" y="30" width="11" height="32" rx="1.4"/>
    <rect x="28" y="40.5" width="31" height="11" rx="1.4"/>
  </g>

  <!-- Faixa azul, por cima do coração -->
  <path d="M12.5 46.5
           C 9 62, 18 79, 38.5 88.5
           C 26 73, 19 59, 19.5 48 Z"
        fill="#16307F"/>
  <path d="M19.5 48
           C 19 59, 26 73, 38.5 88.5
           C 31 74, 25.5 60, 25 49.5 Z"
        fill="#3E74D6"/>
</svg>
